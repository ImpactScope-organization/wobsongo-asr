name: Build Docker image and push to GHCR, deploy BE to Dokploy

on:
  push:
    branches:
      - main 
    paths:
      - "app.py"
      - "streamlit.Dockerfile"
      - ".github/workflows/dokploy.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push BE Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: streamlit.Dockerfile
          push: true
          tags: |
            ghcr.io/impactscope-organization/wobsongo-asr/streamlit:latest
          platforms: linux/amd64

      - name: Trigger Dokploy Deployment
        run: |
          echo "Triggering Dokploy deploy for app ${{ secrets.DOKPLOY_STREAMLIT_ASR_APPLICATION_ID }}..."
          curl -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "applicationId": "${{ secrets.DOKPLOY_STREAMLIT_ASR_APPLICATION_ID }}",
              "env": [
                {"key": "MODAL_PROFILE", "value": "${{ secrets.MODAL_PROFILE }}"},
                {"key": "MODAL_TOKEN_ID", "value": "${{ secrets.MODAL_TOKEN_ID }}"},
                {"key": "MODAL_TOKEN_SECRET", "value": "${{ secrets.MODAL_TOKEN_SECRET }}"}
              ]
            }'