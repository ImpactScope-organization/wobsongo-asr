name: Train Model

on:
  push:
    branches: [main]
    paths:
      - "training/whisper/**"
      - "training/gemma/**"

  workflow_dispatch:
    inputs:
      script:
        description: "Training script to be executed (manual trigger)"
        type: choice
        required: true
        options:
          - training/whisper/train_whisper_small.py
          - training/whisper/train_whisper_small_no_aug.py
          - training/whisper/train_whisper_large.py
          - training/whisper/train_whisper_large_no_aug.py
          - training/gemma/train_gemma_moore.py
          - training/gemma/train_gemma_dyula.py

jobs:
  detect-changes:
    if: github.event_name == 'push'
    name: Detect changed scripts
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.changed.outputs.all_changed_files }}
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get changed training scripts
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            training/whisper/**.py
            training/gemma/**.py
          json: true

  train-on-push:
    if: github.event_name == 'push' && needs.detect-changes.outputs.any_changed == 'true'
    needs: detect-changes
    name: Train ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.detect-changes.outputs.scripts) }}
    concurrency:
      group: train-${{ matrix.script }}
      cancel-in-progress: true
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile check
        run: python -m py_compile "${{ matrix.script }}"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Start training (detached)
        run: modal run --detach "${{ matrix.script }}"

  train-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Train ${{ inputs.script }} (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: train-${{ inputs.script }}
      cancel-in-progress: true
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Start training (detached)
        run: modal run --detach "${{ inputs.script }}"